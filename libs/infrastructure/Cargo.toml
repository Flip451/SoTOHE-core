[package]
name = "infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
semantic-dup = ["dep:arrow-array", "dep:arrow-schema", "dep:fastembed", "dep:lancedb"]
# Exposes internal test-helpers (e.g. ClaudeReviewer::with_bin) as public API.
# Enable only in dev-dependencies of dependent crates that need these helpers.
test-helpers = []

[lints]
workspace = true

[dependencies]
arrow-array = { version = "58", optional = true }
arrow-schema = { version = "58", optional = true }
chrono = { version = "0.4.44", features = ["serde"] }
conch-parser = "0.1.1"
domain = { path = "../domain" }
fastembed = { version = "5.14", optional = true }
futures = "0.3"
lancedb = { version = "0.30", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
usecase = { path = "../usecase" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
syn = { version = "2", features = ["full", "visit"] }
regex.workspace = true
thiserror.workspace = true
toml.workspace = true
rustdoc-types = "0.57"
sha2 = "0.10.9"
fs4 = "0.13.1"
globset = { workspace = true }
libc = "0.2.183"
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
rstest = { workspace = true }
temp-env = "0.3"
tempfile = "3.27.0"

[build-dependencies]
sha2 = "0.10.9"
