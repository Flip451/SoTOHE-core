name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive sccache host directory
        run: echo "SCCACHE_HOST_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"

      - name: Determine remote strict-gate policy and verify regression matrix
        # Keep the branch recreation and the strict gate driven by one decision.
        # A non-track PR deliberately receives `run_gate=true` without a local
        # track branch, causing the existing ci-track gate to fail closed.
        id: remote_strict_gate_policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          readonly STRICT_SIGNAL_GATE="merge"

          policy_for() {
            local event_name="$1"
            local head_ref="$2"
            local base_ref="$3"
            local head_repository="$4"
            local repository="$5"

            if [[ "$event_name" != "pull_request" ]]; then
              printf 'skip\tfalse\tfalse\n'
            elif [[ "$head_ref" == "develop" && "$base_ref" == "main" && "$head_repository" == "$repository" ]]; then
              printf 'release\tfalse\tfalse\n'
            elif [[ "$head_ref" == track/* ]]; then
              printf 'track\ttrue\ttrue\n'
            else
              printf 'unresolved\tfalse\ttrue\n'
            fi
          }

          assert_policy_case() {
            local name="$1"
            local expected="$2"
            shift 2
            local actual
            actual="$(policy_for "$@")"
            if [[ "$actual" != "$expected" ]]; then
              printf 'remote strict-gate regression failed: %s\nexpected: %s\nactual: %s\n' "$name" "$expected" "$actual" >&2
              exit 1
            fi
          }

          assert_strict_merge_gate() {
            if [[ "$STRICT_SIGNAL_GATE" != "merge" ]]; then
              printf 'remote strict-gate regression failed: expected aggregate gate merge, got %s\n' "$STRICT_SIGNAL_GATE" >&2
              exit 1
            fi
          }

          # Regression cases: only an in-repository develop → main release PR
          # may skip. Fork and non-track PR shapes must still invoke the strict
          # gate, with the latter failing closed when no track can be resolved.
          # The only acceptable aggregate signal-gate strictness is `merge`;
          # `commit` checks are retained by ci-track-container but are not a
          # substitute for the remote merge decision.
          assert_strict_merge_gate
          assert_policy_case "push skips the PR-only gate" $'skip\tfalse\tfalse' "push" "" "" "" "owner/repo"
          assert_policy_case "in-repository release PR skips the gate" $'release\tfalse\tfalse' "pull_request" "develop" "main" "owner/repo" "owner/repo"
          assert_policy_case "fork release-shaped PR runs the gate" $'unresolved\tfalse\ttrue' "pull_request" "develop" "main" "fork/repo" "owner/repo"
          assert_policy_case "non-track PR fails closed through the gate" $'unresolved\tfalse\ttrue' "pull_request" "feature/without-track" "develop" "owner/repo" "owner/repo"
          assert_policy_case "track PR recreates its branch and runs the gate" $'track\ttrue\ttrue' "pull_request" "track/example-2026-07-31" "develop" "owner/repo" "owner/repo"

          policy="$(policy_for "$EVENT_NAME" "$HEAD_REF" "$BASE_REF" "$HEAD_REPOSITORY" "$REPOSITORY")"
          IFS=$'\t' read -r mode recreate_track_branch run_track_gate <<< "$policy"

          {
            echo "mode=$mode"
            echo "recreate_track_branch=$recreate_track_branch"
            echo "run_track_gate=$run_track_gate"
            echo "strict_signal_gate=$STRICT_SIGNAL_GATE"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Remote strict-gate evidence"
            echo
            echo "| CI run shape | Policy mode | Recreate local track branch | Run strict track-aware gate | Aggregate signal gate |"
            echo "| --- | --- | --- | --- | --- |"
            printf '| event=%s; head=%s; base=%s; head-repository=%s | %s | %s | %s | `%s` |\n' "$EVENT_NAME" "$HEAD_REF" "$BASE_REF" "$HEAD_REPOSITORY" "$mode" "$recreate_track_branch" "$run_track_gate" "$STRICT_SIGNAL_GATE"
            echo
            echo "Regression matrix passed: strict aggregate merge gate, push, in-repository release PR, fork release-shaped PR, non-track PR, and track PR."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Recreate local track branch on PR merge ref
        # default の merge ref (detached HEAD) を維持しつつ、local branch 名を
        # PR の source branch (`track/<id>`) として再作成する。これで
        # `git rev-parse --abbrev-ref HEAD` が track/<id> を返し、active-track-aware
        # な CLI subcommand (signal check-spec-adr 等) の auto-resolve が機能する。
        # merge ref 上で CI が動くこと自体は変えないため、対象ブランチ (main /
        # develop) の最新と PR の統合状態に対する検証は従来通り保たれる。
        # The policy step is the single source for this condition. It only sets
        # this output for track/* PR heads; all other non-release PRs continue
        # to the strict gate without a track context and fail closed.
        if: steps.remote_strict_gate_policy.outputs.recreate_track_branch == 'true'
        run: git checkout -B "$GITHUB_HEAD_REF"

      - name: Configure git hooks path
        run: git config --local core.hooksPath .githooks

      - name: Export host UID/GID for compose
        id: hostids
        run: |
          # GITHUB_ENV: consumed as shell env ($HOST_UID/$HOST_GID) by the compose
          # `user:` interpolation in the "Start CI container" run: block.
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
          # GITHUB_OUTPUT: consumed as expressions (${{ steps.hostids.outputs.* }})
          # by the docker build-push-action build-args below. Step outputs are
          # reliably available to later steps' expressions, keeping CI_UID/CI_GID
          # unambiguously non-empty for the dev-base-ci chown.
          echo "host_uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "host_gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_HOST_DIR }}
          # Rolling key: the run-id suffix makes the key unique per run so the cache
          # is always saved at job end, and restore-keys restores the most recent
          # prior cache for warm incremental reuse. A static key is immutable once
          # written (actions/cache never overwrites an existing key), which froze the
          # persisted sccache dir at its first save and left every later run at 0%
          # Rust hit -> full recompile.
          key: ${{ runner.os }}-sccache-v3-${{ hashFiles('Dockerfile', '**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-sccache-v3-${{ hashFiles('Dockerfile', '**/Cargo.lock') }}-
            ${{ runner.os }}-sccache-v3-

      - name: Prepare sccache directory
        run: mkdir -p ${{ env.SCCACHE_HOST_DIR }}

      - name: Prepare repo-local cache directories
        run: mkdir -p target .cache/cargo/registry .cache/cargo/git .cache/home .cache/pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build tools image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: false
          load: true
          tags: rust-sdd-template-tools:latest
          build-args: |
            BUILD_ENV=ci
            IMAGE_CARGO_TARGET_DIR=/cargo-target
            CI_UID=${{ steps.hostids.outputs.host_uid }}
            CI_GID=${{ steps.hostids.outputs.host_gid }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure sccache for CI container
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --workdir /workspace \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            rust-sdd-template-tools:latest \
            cargo make --allow-private prepare-local-cache-dirs

      - name: Start CI container
        run: |
          docker compose run -d \
            --name ci-runner \
            tools tail -f /dev/null

      - name: Run CI suite (repo-wide)
        # Override CARGO_HOME / CARGO_TARGET_DIR to the image-baked paths (outside
        # the /workspace bind mount) so the cook-baked deps are reused instead of
        # recompiled. These must match the build-time values for fingerprints to hit:
        # CARGO_HOME=/usr/local/cargo (baked registry), CARGO_TARGET_DIR=/cargo-target
        # (baked compiled deps, set via IMAGE_CARGO_TARGET_DIR at build time).
        run: docker exec -e CARGO_INCREMENTAL=0 -e CARGO_HOME=/usr/local/cargo -e CARGO_TARGET_DIR=/cargo-target ci-runner cargo run --locked --quiet -p cli -- gate-output --name ci-container -- cargo make --allow-private ci-local-steps

      - name: Run CI suite (track-aware gates)
        # track-aware gates (spec/catalogue/impl signal chains) require a
        # track/<id> branch context. This suite retains its commit-level track
        # contract, baseline, and obligation checks; the following aggregate
        # signal step is the strict merge decision. The policy matrix skips only
        # the explicit in-repository develop → main release PR. Every other PR,
        # including a fork release-shaped or non-track head, runs both gates; an
        # unresolved track context therefore fails closed rather than succeeding
        # or gracefully skipping.
        if: steps.remote_strict_gate_policy.outputs.run_track_gate == 'true'
        run: docker exec -e CARGO_INCREMENTAL=0 -e CARGO_HOME=/usr/local/cargo -e CARGO_TARGET_DIR=/cargo-target ci-runner cargo make ci-track-container

      - name: Run strict merge signal gate
        # The policy step binds this to the regression-checked `merge` value.
        # Run the existing aggregate `sotp signal check` CLI through Cargo so a
        # fresh checkout does not depend on the ignored local bin/sotp binary;
        # do not duplicate individual chain checks in workflow YAML.
        if: steps.remote_strict_gate_policy.outputs.run_track_gate == 'true'
        run: docker exec -e CARGO_INCREMENTAL=0 -e CARGO_HOME=/usr/local/cargo -e CARGO_TARGET_DIR=/cargo-target ci-runner cargo run --quiet -p cli -- signal check --gate "${{ steps.remote_strict_gate_policy.outputs.strict_signal_gate }}"

      - name: Show sccache stats
        if: always()
        run: docker exec ci-runner sccache --show-stats || true

      - name: Stop CI container
        if: always()
        run: docker rm -f ci-runner || true

      - name: Fix cache permissions
        if: always()
        run: sudo chown -R $(id -u):$(id -g) ${{ env.SCCACHE_HOST_DIR }} || true
